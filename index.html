<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星港 · 个人导航</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%234ADEDE"/><stop offset="1" stop-color="%23818CF8"/></linearGradient></defs><path d="M16 2l3.2 9.6L29 15l-9.8 3.4L16 30l-3.2-11.6L3 15l9.8-3.4z" fill="url(%23g)"/></svg>'>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070B16;
    --ink:#E8EEF9;
    --ink-2:#93A1B8;
    --ink-3:#5D6B84;
    --line:rgba(148,163,184,.14);
    --line-strong:rgba(148,163,184,.30);
    --card:rgba(255,255,255,.045);
    --card-hover:rgba(255,255,255,.085);
    --cyan:#4ADEDE;
    --violet:#A78BFA;
    --mono:'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,sans-serif;
  }
  html,body{min-height:100%}
  body{
    background:radial-gradient(1100px 700px at 50% -180px,#0D1530,var(--bg));
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .aurora{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 520px at 72% -8%,rgba(99,102,241,.16),transparent 62%),
      radial-gradient(760px 460px at 12% 12%,rgba(34,211,238,.10),transparent 60%);
  }
  .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    max-width:1160px;width:100%;margin:0 auto;padding:22px 28px 0;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{width:22px;height:22px;flex:none}
  .brand-name{font-weight:600;font-size:15px;letter-spacing:.06em}
  .brand-en{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--ink-3);margin-top:2px}
  .toolbar{display:flex;gap:8px}
  .tbtn{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-2);
    padding:7px 15px;border-radius:10px;font-size:12.5px;cursor:pointer;
    font-family:var(--sans);position:relative;transition:color .18s,border-color .18s,background .18s;
  }
  .tbtn:hover{color:var(--ink);border-color:var(--line-strong)}
  .tbtn.active{color:var(--ink);border-color:rgba(74,222,222,.55);background:rgba(74,222,222,.10)}
  .reset{display:none}
  body.editing .reset{display:inline-block}
  .auth-only{display:none}
  body.logged .auth-only{display:inline-block}
  .user-chip{display:none;align-items:center;gap:6px;color:var(--cyan);font-size:12px;padding:0 8px;font-family:var(--mono);letter-spacing:.1em}
  body.logged .user-chip{display:flex}
  #loginBtn{display:inline-block}
  body.logged #loginBtn{display:none}
  #logoutBtn{display:none}
  body.logged #logoutBtn{display:inline-block}
  .keep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:-2px 0 12px;cursor:pointer}
  .login-err{color:#F87171;font-size:12.5px;min-height:18px;margin:0 0 4px}

  main{max-width:1160px;width:100%;margin:0 auto;padding:0 28px;flex:1}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:44px 0 6px;animation:rise .55s ease both}
  .greet{color:var(--cyan);font-size:13px;letter-spacing:.44em;text-indent:.44em}
  .clock{
    font-family:var(--mono);font-weight:600;
    font-size:clamp(46px,7vw,66px);
    letter-spacing:.05em;margin:8px 0 10px;
    font-variant-numeric:tabular-nums;
  }
  .clock .c{color:var(--cyan);animation:blink 2.4s ease-in-out infinite}
  .date-line{color:var(--ink-2);font-size:14px;letter-spacing:.06em}
  .search{
    max-width:640px;margin:30px auto 0;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;
    padding:6px 7px 6px 16px;backdrop-filter:blur(6px);
    transition:border-color .2s,box-shadow .2s;
  }
  .search:focus-within{
    border-color:rgba(74,222,222,.55);
    box-shadow:0 0 0 3px rgba(74,222,222,.12),0 10px 44px rgba(74,222,222,.09);
  }
  .search svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-size:15px;height:40px;font-family:var(--sans);min-width:0;
  }
  .search input::placeholder{color:var(--ink-3)}
  .go{
    height:40px;padding:0 20px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(135deg,var(--cyan),#818CF8);
    color:#07222B;font-weight:700;font-size:13.5px;font-family:var(--sans);
    transition:filter .18s;
  }
  .go:hover{filter:brightness(1.1)}
  .engines{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;animation:rise .55s ease .06s both}
  .chip{
    font-size:12.5px;color:var(--ink-2);background:rgba(255,255,255,.04);
    border:1px solid var(--line);padding:5px 15px;border-radius:99px;cursor:pointer;
    font-family:var(--sans);transition:color .18s,background .18s,border-color .18s;
  }
  .chip:hover{color:var(--ink);border-color:var(--line-strong)}
  .chip[aria-pressed="true"]{color:#07222B;background:var(--cyan);border-color:transparent;font-weight:600}

  /* ---------- groups ---------- */
  .group-head{display:flex;align-items:baseline;gap:11px;margin:38px 0 13px}
  .group-en{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--ink-3)}
  .group-head h2{font-size:16.5px;font-weight:600;letter-spacing:.03em}
  .count{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:99px;padding:1px 9px;margin-left:auto;
  }
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .card{
    display:flex;align-items:center;gap:11px;padding:12px 14px;position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    color:var(--ink);text-decoration:none;
    transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-2px);background:var(--card-hover);
    border-color:var(--line-strong);box-shadow:0 8px 26px rgba(0,0,0,.35);
  }
  .avatar{
    width:38px;height:38px;border-radius:11px;flex:none;
    display:grid;place-items:center;font-size:15px;font-weight:600;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.28);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
  }
  .meta{min-width:0}
  .name{font-size:13.5px;font-weight:500;line-height:1.25;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .domain{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;display:block;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .del{
    position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
    background:#EF4444;color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer;
    display:none;place-items:center;box-shadow:0 2px 10px rgba(239,68,68,.45);
  }
  .del:hover{transform:scale(1.12)}
  body.editing .del{display:grid}
  .add-tile{
    display:none;min-height:62px;border:1px dashed var(--line-strong);border-radius:14px;
    background:transparent;color:var(--ink-2);font-size:13px;cursor:pointer;
    align-items:center;justify-content:center;font-family:var(--sans);
    transition:color .18s,border-color .18s;
  }
  .add-tile:hover{color:var(--ink);border-color:var(--cyan)}
  body.editing .add-tile{display:flex}
  .empty{color:var(--ink-3);font-size:13px;padding:6px 2px}

  /* ---------- footer ---------- */
  .foot{
    text-align:center;color:var(--ink-3);font-size:12px;
    padding:46px 0 36px;font-family:var(--mono);letter-spacing:.05em;
  }
  .foot kbd{
    border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-size:11px;background:rgba(255,255,255,.04);font-family:var(--mono);
  }

  /* ---------- note panel ---------- */
  .note{
    position:fixed;right:20px;bottom:20px;width:330px;max-width:calc(100vw - 32px);
    background:rgba(13,20,38,.93);border:1px solid var(--line-strong);border-radius:16px;
    padding:14px 16px;z-index:40;backdrop-filter:blur(10px);
    box-shadow:0 14px 44px rgba(0,0,0,.45);display:none;
  }
  .note.open{display:block;animation:rise .25s ease both}
  .note-head{display:flex;align-items:center;margin-bottom:8px}
  .note-title{font-size:12.5px;color:var(--ink-2);letter-spacing:.08em}
  .note-save{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.14em;margin-left:10px}
  .note-close{
    margin-left:auto;background:none;border:none;color:var(--ink-3);cursor:pointer;
    font-size:14px;padding:2px 6px;border-radius:6px;
  }
  .note-close:hover{color:var(--ink)}
  .note textarea{
    width:100%;height:176px;background:none;border:none;outline:none;resize:vertical;
    color:var(--ink);font-size:13.5px;line-height:1.7;font-family:var(--sans);
  }
  .note textarea::placeholder{color:var(--ink-3)}

  /* ---------- bookmark manager ---------- */
  .bk{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(720px,calc(100vw - 28px));height:min(560px,calc(100vh - 56px));
    background:rgba(13,20,38,.97);border:1px solid var(--line-strong);border-radius:18px;
    padding:16px 18px;z-index:50;backdrop-filter:blur(10px);
    box-shadow:0 24px 70px rgba(0,0,0,.5);display:none;flex-direction:column;
  }
  .bk.open{display:flex;animation:rise .22s ease both}
  .bk-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .bk-title{font-size:14.5px;font-weight:600;letter-spacing:.04em}
  .bk-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
  .bk-search{
    flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-size:13px;height:34px;padding:0 12px;outline:none;font-family:var(--sans);
  }
  .bk-search:focus{border-color:rgba(74,222,222,.5)}
  .bk-add{
    background:linear-gradient(135deg,var(--cyan),#818CF8);border:none;color:#07222B;
    font-weight:700;font-size:12.5px;height:34px;padding:0 16px;border-radius:10px;cursor:pointer;font-family:var(--sans);flex:none;
  }
  .bk-close{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px;flex:none}
  .bk-close:hover{color:var(--ink)}
  .bk-list{flex:1;overflow-y:auto;padding-right:4px}
  .bk-folder{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);margin:14px 4px 8px}
  .bk-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;cursor:pointer;
    border:1px solid transparent;transition:background .15s,border-color .15s;
  }
  .bk-item:hover,.bk-item:focus-visible{background:var(--card-hover);border-color:var(--line)}
  .bk-ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .bk-meta{min-width:0;flex:1;display:flex;flex-direction:column}
  .bk-name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-dom{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex:none}
  .bk-item:hover .bk-acts,.bk-item:focus-within .bk-acts{opacity:1}
  .bk-act{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:12.5px;padding:6px;border-radius:8px;font-family:var(--sans)}
  .bk-act:hover{color:var(--ink);background:rgba(255,255,255,.08)}
  .bk-act[data-act="del"]:hover{color:#F87171;background:rgba(248,113,113,.12)}
  .bk-empty{color:var(--ink-3);font-size:13px;text-align:center;padding:44px 0}

  /* ---------- account manager & password meter ---------- */
  .acct-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
    border:1px solid transparent;transition:background .15s,border-color .15s;
  }
  .acct-item:hover{background:var(--card-hover);border-color:var(--line)}
  .acct-ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#07222B;background:linear-gradient(135deg,var(--cyan),#818CF8)}
  .acct-meta{min-width:0;flex:1;display:flex;flex-direction:column}
  .acct-name{font-size:13.5px;display:flex;align-items:center;gap:8px}
  .acct-self{font-family:var(--mono);font-size:9.5px;color:var(--cyan);border:1px solid rgba(74,222,222,.4);border-radius:99px;padding:1px 7px;letter-spacing:.08em}
  .acct-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
  .acct-status{font-size:11px;border-radius:99px;padding:2px 10px;font-family:var(--mono);flex:none;letter-spacing:.06em}
  .acct-status.ok{color:#34D399;border:1px solid rgba(52,211,153,.4)}
  .acct-status.locked{color:#F87171;border:1px solid rgba(248,113,113,.4)}
  .acct-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex:none}
  .acct-item:hover .acct-acts{opacity:1}
  .pw-meter{display:flex;gap:5px;flex-wrap:wrap;margin:-6px 0 12px}
  .pw-meter span{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:2px 9px;transition:color .15s,border-color .15s}
  .pw-meter span.on{color:#34D399;border-color:rgba(52,211,153,.5)}
  .pw-meter.fail span[data-k="len"]{color:#F87171;border-color:rgba(248,113,113,.4)}

  /* ---------- role gating & page chip ---------- */
  .admin-only{display:none}
  body.role-admin .admin-only{display:inline-block}
  .page-chip{display:none;align-items:center;color:var(--ink-2);font-size:11px;padding:2px 10px;font-family:var(--mono);letter-spacing:.12em;border:1px solid var(--line);border-radius:99px}
  body.logged .page-chip{display:flex}
  .acct-role{font-family:var(--mono);font-size:9.5px;color:var(--violet);border:1px solid rgba(167,139,250,.4);border-radius:99px;padding:1px 7px;letter-spacing:.08em}
  .acct-role.user{color:var(--ink-3);border-color:var(--line)}

  /* ---------- dialog ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,8,18,.62);backdrop-filter:blur(4px);
    display:grid;place-items:center;z-index:60;
  }
  .overlay[hidden]{display:none}
  .dialog{
    width:min(430px,calc(100vw - 32px));background:#0D1530;
    border:1px solid var(--line-strong);border-radius:18px;padding:24px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);animation:rise .22s ease both;
  }
  .dialog h3{font-size:16px;font-weight:600;margin-bottom:18px;letter-spacing:.03em}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:7px;letter-spacing:.05em}
  .field input,.field select{
    width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);padding:10px 13px;font-size:14px;outline:none;
    font-family:var(--sans);transition:border-color .18s;
  }
  .field input:focus,.field select:focus{border-color:rgba(74,222,222,.5)}
  .field.err input{border-color:#EF4444}
  .dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .dlg-cancel{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-2);
    padding:9px 18px;border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--sans);
  }
  .dlg-cancel:hover{color:var(--ink);border-color:var(--line-strong)}
  .dlg-save{
    background:linear-gradient(135deg,var(--cyan),#818CF8);border:none;color:#07222B;
    padding:9px 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);
  }
  .dlg-save:hover{filter:brightness(1.1)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:#132036;border:1px solid var(--line-strong);color:var(--ink);
    padding:10px 18px;border-radius:12px;font-size:13px;z-index:70;
    display:flex;gap:14px;align-items:center;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{background:none;border:none;color:var(--cyan);cursor:pointer;font-size:13px;font-weight:600;font-family:var(--sans)}

  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  @media (max-width:640px){
    .topbar{padding:16px 18px 0}
    main{padding:0 18px}
    .hero{padding-top:30px}
    .greet{letter-spacing:.3em;text-indent:.3em}
    .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .search{margin-top:24px}
    .go{padding:0 14px}
    .brand-en{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>

<div class="page">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ADEDE"/><stop offset="1" stop-color="#818CF8"/></linearGradient></defs><path d="M16 2l3.2 9.6L29 15l-9.8 3.4L16 30l-3.2-11.6L3 15l9.8-3.4z" fill="url(#bg1)"/></svg>
      <div>
        <div class="brand-name">星港导航</div>
        <div class="brand-en">STARPORT</div>
      </div>
    </div>
      <div class="toolbar">
        <span class="user-chip" id="userChip">◈ admin</span>
        <span class="page-chip" id="pageChip">原始首页</span>
        <button type="button" class="tbtn auth-only" id="noteBtn">便签<span id="noteDot" style="display:none;position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan)"></span></button>
        <button type="button" class="tbtn auth-only" id="bmBtn">书签</button>
        <button type="button" class="tbtn admin-only" id="acctBtn">账号</button>
        <button type="button" class="tbtn reset" id="resetBtn">恢复默认</button>
        <button type="button" class="tbtn auth-only" id="editBtn">编辑</button>
        <button type="button" class="tbtn" id="loginBtn">登录</button>
        <button type="button" class="tbtn" id="logoutBtn">退出</button>
      </div>
  </header>

  <main>
    <section class="hero">
      <p class="greet" id="greet">你好</p>
      <h1 class="clock" id="clock" aria-label="当前时间">--<span class="c">:</span>--<span class="c">:</span>--</h1>
      <p class="date-line" id="dateLine"></p>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="搜索一下，或直接输入网址…" autocomplete="off" spellcheck="false" aria-label="搜索或输入网址">
        <button type="submit" class="go">搜索</button>
      </form>
      <div class="engines" id="engines" role="group" aria-label="搜索引擎"></div>
    </section>

    <div id="groups"></div>
  </main>

<script>
(function(){
'use strict';

/* ================= 数据 ================= */
var GROUPS=[
  {id:'office',en:'OFFICE',name:'办公协同'},
  {id:'life',en:'LIFE',name:'娱乐与生活'}
];
function d(name,url,group,c1,c2){return {name:name,url:url,group:group,c1:c1,c2:c2,domain:url.replace(/^https?:\/\//,'')};}
var DEFAULT_LINKS=[
  d('网易邮箱','https://mail.163.com','office','#60A5FA','#2563EB'),
  d('QQ邮箱','https://mail.qq.com','office','#38BDF8','#0284C7'),
  d('腾讯文档','https://docs.qq.com','office','#22D3EE','#3B82F6'),
  d('石墨文档','https://shimo.im','office','#34D399','#0EA5E9'),
  d('钉钉','https://im.dingtalk.com','office','#7DD3FC','#2563EB'),
  d('企业微信','https://work.weixin.qq.com','office','#5EEAD4','#0EA5E9'),
  d('飞书','https://www.feishu.cn','office','#60A5FA','#818CF8'),
  d('腾讯会议','https://meeting.tencent.com','office','#67E8F9','#6366F1'),
  d('百度网盘','https://pan.baidu.com','office','#818CF8','#60A5FA'),
  d('阿里云盘','https://www.alipan.com','office','#34D399','#22D3EE'),
  d('哔哩哔哩','https://www.bilibili.com','life','#FB7299','#EC4899'),
  d('爱奇艺','https://www.iqiyi.com','life','#4ADE80','#10B981'),
  d('腾讯视频','https://v.qq.com','life','#FBBF24','#F59E0B'),
  d('网易云音乐','https://music.163.com','life','#F87171','#DC2626'),
  d('微博','https://weibo.com','life','#FB7185','#F97316'),
  d('小红书','https://www.xiaohongshu.com','life','#FB7185','#E11D48'),
  d('淘宝','https://www.taobao.com','life','#FB923C','#F97316'),
  d('京东','https://www.jd.com','life','#FCA5A5','#DC2626'),
  d('美团','https://www.meituan.com','life','#FDE047','#F59E0B'),
  d('携程','https://www.ctrip.com','life','#38BDF8','#2563EB'),
  d('高德地图','https://www.amap.com','life','#4ADE80','#0EA5E9'),
  d('12306','https://www.12306.cn','life','#93C5FD','#3B82F6')
];
var ENGINES=[
  {name:'百度',url:'https://www.baidu.com/s?wd=%s'},
  {name:'必应',url:'https://www.bing.com/search?q=%s'},
  {name:'知乎',url:'https://www.zhihu.com/search?type=content&q=%s'},
  {name:'B站',url:'https://search.bilibili.com/all?keyword=%s'},
  {name:'微博',url:'https://s.weibo.com/weibo?q=%s'}
];

/* ================= 工具 ================= */
var store={
  get:function(k,f){try{var v=localStorage.getItem(k);return v===null?f:JSON.parse(v);}catch(e){return f;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ================= 状态 ================= */
/* 数据以服务端为准：先渲染默认数据，加载成功后由服务端数据覆盖 */
var links=DEFAULT_LINKS.map(function(x){return {
  id:uid(),name:x.name,url:x.url,domain:x.domain,group:x.group,c1:x.c1,c2:x.c2
};});
var engineIdx=Math.min(Math.max(0,store.get('starport.engine',0)),ENGINES.length-1);
var editing=false;

/* ================= 引用 ================= */
var $=function(id){return document.getElementById(id);};
var groupsEl=$('groups'),enginesEl=$('engines'),input=$('searchInput'),
    clockEl=$('clock'),dateEl=$('dateLine'),greetEl=$('greet'),
    editBtn=$('editBtn'),resetBtn=$('resetBtn'),
    noteBtn=$('noteBtn'),noteDot=$('noteDot'),notePanel=$('notePanel'),noteText=$('noteText'),noteClose=$('noteClose'),
    overlay=$('overlay'),dlgForm=$('dlgForm'),dlgTitle=$('dlgTitle'),
    fName=$('fName'),fUrl=$('fUrl'),fGroup=$('fGroup'),
    fWrapName=$('fWrapName'),fWrapUrl=$('fWrapUrl'),
    toastEl=$('toast'),searchForm=$('searchForm'),
    loginBtn=$('loginBtn'),logoutBtn=$('logoutBtn'),
    loginOverlay=$('loginOverlay'),loginForm=$('loginForm'),
    lUser=$('lUser'),lPass=$('lPass'),loginErr=$('loginErr'),lWrapPass=$('lWrapPass'),
    bmBtn=$('bmBtn'),bmPanel=$('bmPanel'),bmList=$('bmList'),bmCount=$('bmCount'),
    bmSearch=$('bmSearch'),bmAddBtn=$('bmAddBtn'),bmCloseEl=$('bmClose'),
    bmOverlay=$('bmOverlay'),bmForm=$('bmForm'),bmDlgTitle=$('bmDlgTitle'),
    bmName=$('bmName'),bmUrl=$('bmUrl'),bmFolder=$('bmFolder'),bmFolderList=$('bmFolderList'),
    bmWrapName=$('bmWrapName'),bmWrapUrl=$('bmWrapUrl'),
    acctBtn=$('acctBtn'),acctPanel=$('acctPanel'),acctList=$('acctList'),acctCount=$('acctCount'),
    acctAddBtn=$('acctAddBtn'),acctCloseEl=$('acctClose'),
    acctOverlay=$('acctOverlay'),acctForm=$('acctForm'),acctDlgTitle=$('acctDlgTitle'),
    aUser=$('aUser'),aPass=$('aPass'),aPass2=$('aPass2'),aRole=$('aRole'),
    aWrapUser=$('aWrapUser'),aWrapPass=$('aWrapPass'),aWrapPass2=$('aWrapPass2'),aWrapRole=$('aWrapRole'),
    pwMeter=$('pwMeter'),acctErr=$('acctErr'),pageChip=$('pageChip');

function persist(){
  api('links.php',{method:'POST',body:{links:links}}).then(function(d){
    if(d&&d.ok)return;
    showToast(d&&d.error==='unauthorized'?'登录已过期，请重新登录':'保存失败，请重试');
  }).catch(function(){showToast('网络异常，保存失败');});
}
function persistEngine(){store.set('starport.engine',engineIdx);}

/* ================= 时钟 ================= */
function greetText(h){
  if(h<5)return '夜深了';
  if(h<9)return '早上好';
  if(h<12)return '上午好';
  if(h<14)return '中午好';
  if(h<18)return '下午好';
  if(h<23)return '晚上好';
  return '夜深了';
}
function tick(){
  var n=new Date(),p=function(x){return String(x).padStart(2,'0');};
  clockEl.innerHTML=p(n.getHours())+'<span class="c">:</span>'+p(n.getMinutes())+'<span class="c">:</span>'+p(n.getSeconds());
  clockEl.setAttribute('aria-label','当前时间 '+p(n.getHours())+':'+p(n.getMinutes()));
  dateEl.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 · 星期'+'日一二三四五六'.charAt(n.getDay());
  greetEl.textContent=greetText(n.getHours());
}
setInterval(tick,1000);tick();

/* ================= 搜索 ================= */
function renderChips(){
  enginesEl.innerHTML=ENGINES.map(function(e,i){
    return '<button type="button" class="chip" data-i="'+i+'" aria-pressed="'+(i===engineIdx)+'">'+e.name+'</button>';
  }).join('');
}
enginesEl.addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  engineIdx=parseInt(b.dataset.i,10);persistEngine();renderChips();input.focus();
});
searchForm.addEventListener('submit',function(e){
  e.preventDefault();
  var q=input.value.trim();if(!q)return;
  var isUrl=/^https?:\/\/\S+$/i.test(q)||/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q);
  var target=isUrl?(/^https?:\/\//i.test(q)?q:('https://'+q)):ENGINES[engineIdx].url.replace('%s',encodeURIComponent(q));
  window.open(target,'_blank','noopener');
});

/* ================= 渲染分组 ================= */
function cardHtml(x){
  var g1=x.c1||'#3B82F6',g2=x.c2||'#6366F1';
  return '<a class="card" data-id="'+esc(x.id)+'" href="'+esc(x.url)+'" target="_blank" rel="noopener">'
    +'<span class="avatar" style="background:linear-gradient(135deg,'+g1+','+g2+')">'+esc(String(x.name).charAt(0))+'</span>'
    +'<span class="meta"><span class="name">'+esc(x.name)+'</span><span class="domain">'+esc(x.domain)+'</span></span>'
    +'<button type="button" class="del" data-id="'+esc(x.id)+'" aria-label="删除 '+esc(x.name)+'">✕</button>'
    +'</a>';
}
function render(){
  groupsEl.innerHTML=GROUPS.map(function(g){
    var items=links.filter(function(x){return x.group===g.id;});
    var cards=items.map(cardHtml).join('');
    var add=editing?'<button type="button" class="add-tile" data-group="'+g.id+'">＋ 添加链接</button>':'';
    var empty=(!items.length&&!editing)?'<p class="empty">暂无链接 · 点右上角「编辑」添加</p>':'';
    return '<section class="group"><div class="group-head">'
      +'<span class="group-en">'+g.en+'</span><h2>'+g.name+'</h2>'
      +'<span class="count">'+items.length+'</span></div>'
      +'<div class="cards">'+cards+add+'</div>'+empty+'</section>';
  }).join('');
}
groupsEl.addEventListener('click',function(e){
  var del=e.target.closest('.del');
  if(del){e.preventDefault();e.stopPropagation();removeLink(del.dataset.id);return;}
  var add=e.target.closest('.add-tile');
  if(add){openDialog(null,add.dataset.group);return;}
  var card=e.target.closest('a.card');
  if(card&&editing){
    e.preventDefault();
    var it=null;
    for(var i=0;i<links.length;i++){if(links[i].id===card.dataset.id){it=links[i];break;}}
    openDialog(it,null);
  }
});

/* ================= 编辑模式 ================= */
editBtn.addEventListener('click',function(){
  editing=!editing;
  document.body.classList.toggle('editing',editing);
  editBtn.textContent=editing?'完成':'编辑';
  editBtn.classList.toggle('active',editing);
  render();
});
resetBtn.addEventListener('click',function(){
  if(confirm('恢复默认链接？\n您添加或修改过的链接将被清除。')){
    links=DEFAULT_LINKS.map(function(x){return {
      id:uid(),name:x.name,url:x.url,domain:x.domain,group:x.group,c1:x.c1,c2:x.c2
    };});
    persist();render();showToast('已恢复默认链接');
  }
});

/* ================= 弹窗 ================= */
var dlgId=null;
function openDialog(link,group){
  dlgId=link?link.id:null;
  dlgTitle.textContent=link?'编辑链接':'添加链接';
  fName.value=link?link.name:'';
  fUrl.value=link?link.url:'';
  fGroup.value=link?link.group:(group||'office');
  fWrapName.classList.remove('err');fWrapUrl.classList.remove('err');
  overlay.hidden=false;
  setTimeout(function(){fName.focus();},30);
}
function closeDialog(){overlay.hidden=true;dlgId=null;}
$('dlgCancel').addEventListener('click',closeDialog);
overlay.addEventListener('click',function(e){if(e.target===overlay)closeDialog();});
function flashErr(w){w.classList.add('err');setTimeout(function(){w.classList.remove('err');},700);}
dlgForm.addEventListener('submit',function(e){
  e.preventDefault();
  var name=fName.value.trim(),urlIn=fUrl.value.trim();
  if(!name){flashErr(fWrapName);fName.focus();return;}
  if(!urlIn){flashErr(fWrapUrl);fUrl.focus();return;}
  var url=urlIn;
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  var domain=url.replace(/^https?:\/\//,'').split('/')[0];
  if(dlgId){
    for(var i=0;i<links.length;i++){
      if(links[i].id===dlgId){links[i].name=name;links[i].url=url;links[i].domain=domain;links[i].group=fGroup.value;break;}
    }
  }else{
    links.push({id:uid(),name:name,url:url,domain:domain,group:fGroup.value,c1:'#3B82F6',c2:'#818CF8'});
  }
  persist();render();closeDialog();
});

/* ================= 删除 + 撤销 ================= */
var toastTimer=null;
function hideToast(){toastEl.classList.remove('show');}
function showToast(msg,undo){
  toastEl.innerHTML='';
  toastEl.appendChild(document.createTextNode(msg));
  if(undo){
    var b=document.createElement('button');
    b.type='button';b.textContent='撤销';
    b.addEventListener('click',function(){undo();hideToast();});
    toastEl.appendChild(b);
  }
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast,6000);
}
function removeLink(id){
  var i=-1;
  for(var k=0;k<links.length;k++){if(links[k].id===id){i=k;break;}}
  if(i<0)return;
  var item=links[i];
  links.splice(i,1);persist();render();
  showToast('已删除「'+item.name+'」',function(){
    links.splice(Math.min(i,links.length),0,item);
    persist();render();
  });
}

/* ================= 便签 ================= */
var noteTimer=null;
function updateNoteDot(){
  var has=logged&&noteText.value.trim().length>0;
  noteDot.style.display=(has&&!notePanel.classList.contains('open'))?'block':'none';
}
function openNote(){notePanel.classList.add('open');updateNoteDot();loadNote();setTimeout(function(){noteText.focus();},30);}
function closeNote(){notePanel.classList.remove('open');updateNoteDot();}
noteBtn.addEventListener('click',function(){
  if(notePanel.classList.contains('open'))closeNote();else openNote();
});
noteClose.addEventListener('click',closeNote);
function loadNote(){
  api('note.php').then(function(d){
    if(d&&d.ok&&document.activeElement!==noteText){noteText.value=d.note||'';}
    updateNoteDot();
  }).catch(function(){});
}
noteText.addEventListener('input',function(){
  clearTimeout(noteTimer);
  noteTimer=setTimeout(function(){
    api('note.php',{method:'POST',body:{note:noteText.value}})
      .then(function(d){if(!d||!d.ok)showToast('便签保存失败');})
      .catch(function(){showToast('便签保存失败');});
    updateNoteDot();
  },800);
});
updateNoteDot();

/* ================= 登录门禁（编辑权限，服务端鉴权） ================= */
/* 账号密码存于服务端数据库（nav_admin 表，bcrypt 哈希），页面源码不含任何凭据。
   修改密码：SSH 登录服务器后执行
   php -r "echo password_hash('新密码', PASSWORD_BCRYPT);"
   然后把输出的哈希写入数据库：
   UPDATE nav_admin SET pass_hash='<新哈希>' WHERE id=1;（可通过面板 phpMyAdmin 或一次性 PHP 脚本执行） */
var API='api/';
var logged=false;
function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},opts.headers||{});
  if(opts.body&&typeof opts.body!=='string')opts.body=JSON.stringify(opts.body);
  return fetch(API+path,opts).then(function(r){return r.json();});
}
function applyAuth(){
  document.body.classList.toggle('logged',logged);
  document.body.classList.toggle('role-admin',logged&&window.__role==='admin');
  document.body.classList.toggle('role-user',logged&&window.__role==='user');
  if(logged){
    userChip.textContent='◈ '+(window.__selfUser||'')+(window.__role==='admin'?' · 管理员':' · 用户');
  }
  if(!logged){
    if(editing){
      editing=false;
      document.body.classList.remove('editing');
      editBtn.textContent='编辑';
      editBtn.classList.remove('active');
    }
    notePanel.classList.remove('open');
    bmPanel.classList.remove('open');
    bmOverlay.hidden=true;
    acctPanel.classList.remove('open');
    acctOverlay.hidden=true;
  }
  updateNoteDot();
}
function closeLogin(){loginOverlay.hidden=true;}

$('loginCancel').addEventListener('click',closeLogin);
loginOverlay.addEventListener('click',function(e){if(e.target===loginOverlay)closeLogin();});

logoutBtn.addEventListener('click',function(){

/* ================= 书签管理器（登录后可用） ================= */
var bookmarks=[],bmEditId=null;
function bmDomain(u){return String(u).replace(/^https?:\/\//,'').split('/')[0];}
function bmGrad(u){
  var h=0,s=String(u);
  for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  var h1=h%360,h2=(h1+46)%360;
  return 'linear-gradient(135deg,hsl('+h1+',70%,55%),hsl('+h2+',75%,62%))';
}
function loadBookmarks(){
  api('bookmarks.php').then(function(d){
    if(d&&d.ok){bookmarks=d.bookmarks||[];renderBookmarks();}
  }).catch(function(){});
}
function saveBookmarks(){
  api('bookmarks.php',{method:'POST',body:{bookmarks:bookmarks}}).then(function(d){
    if(!d||!d.ok)showToast(d&&d.error==='unauthorized'?'登录已过期，请重新登录':'书签保存失败，请重试');
  }).catch(function(){showToast('网络异常，书签保存失败');});
}
function bmFiltered(){
  var q=bmSearch.value.trim().toLowerCase();
  if(!q)return bookmarks;
  return bookmarks.filter(function(b){
    return (b.name+' '+b.url+' '+(b.folder||'')).toLowerCase().indexOf(q)>=0;
  });
}
function refreshFolderDatalist(){
  var seen={},opts='';
  bookmarks.forEach(function(b){var f=b.folder||'默认';if(!seen[f]){seen[f]=1;opts+='<option value="'+esc(f)+'">';}});
  bmFolderList.innerHTML=opts;
}
function renderBookmarks(){
  var list=bmFiltered();
  bmCount.textContent=bookmarks.length;
  if(!list.length){
    bmList.innerHTML='<p class="bk-empty">'+(bookmarks.length?'没有匹配的书签':'还没有书签 · 点「＋ 添加」收藏第一个网址')+'</p>';
    refreshFolderDatalist();return;
  }
  var byFolder={},order=[];
  list.forEach(function(b){
    var f=b.folder||'默认';
    if(!byFolder[f]){byFolder[f]=[];order.push(f);}
    byFolder[f].push(b);
  });
  var html='';
  order.forEach(function(f){
    html+='<div class="bk-folder">'+esc(f)+' · '+byFolder[f].length+'</div>';
    byFolder[f].forEach(function(b){
      html+='<div class="bk-item" data-id="'+esc(b.id)+'" role="link" tabindex="0">'
        +'<span class="bk-ava" style="background:'+bmGrad(b.url)+'">'+esc(String(b.name).charAt(0)||'★')+'</span>'
        +'<span class="bk-meta"><span class="bk-name">'+esc(b.name)+'</span><span class="bk-dom">'+esc(bmDomain(b.url))+'</span></span>'
        +'<span class="bk-acts">'
        +'<button type="button" class="bk-act" data-act="edit" data-id="'+esc(b.id)+'" aria-label="编辑书签 '+esc(b.name)+'">✎</button>'
        +'<button type="button" class="bk-act" data-act="del" data-id="'+esc(b.id)+'" aria-label="删除书签 '+esc(b.name)+'">✕</button>'
        +'</span></div>';
    });
  });
  bmList.innerHTML=html;
  refreshFolderDatalist();
}
function openBm(){bmPanel.classList.add('open');loadBookmarks();bmSearch.value='';setTimeout(function(){bmSearch.focus();},30);}
function closeBm(){bmPanel.classList.remove('open');}
function closeBmOverlay(){bmOverlay.hidden=true;bmEditId=null;}
bmBtn.addEventListener('click',function(){
  if(bmPanel.classList.contains('open'))closeBm();else openBm();
});
bmCloseEl.addEventListener('click',closeBm);
bmSearch.addEventListener('input',renderBookmarks);
function findBm(id){
  for(var i=0;i<bookmarks.length;i++){if(bookmarks[i].id===id)return bookmarks[i];}
  return null;
}
bmList.addEventListener('click',function(e){
  var act=e.target.closest('.bk-act');
  if(act){
    e.stopPropagation();
    var bm=findBm(act.dataset.id);
    if(!bm)return;
    if(act.dataset.act==='del'){removeBookmark(bm.id);return;}
    bmEditId=bm.id;bmDlgTitle.textContent='编辑书签';
    bmName.value=bm.name;bmUrl.value=bm.url;bmFolder.value=bm.folder||'';
    bmWrapName.classList.remove('err');bmWrapUrl.classList.remove('err');
    bmOverlay.hidden=false;setTimeout(function(){bmName.focus();},30);
    return;
  }
  var item=e.target.closest('.bk-item');
  if(item){
    var b=findBm(item.dataset.id);
    if(b)window.open(b.url,'_blank','noopener');
  }
});
bmList.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var item=e.target.closest('.bk-item');
  if(item&&e.target===item){
    var b=findBm(item.dataset.id);
    if(b)window.open(b.url,'_blank','noopener');
  }
});
bmAddBtn.addEventListener('click',function(){
  bmEditId=null;bmDlgTitle.textContent='添加书签';
  bmName.value='';bmUrl.value='';bmFolder.value='';
  bmWrapName.classList.remove('err');bmWrapUrl.classList.remove('err');
  bmOverlay.hidden=false;setTimeout(function(){bmName.focus();},30);
});
$('bmCancel').addEventListener('click',closeBmOverlay);
bmOverlay.addEventListener('click',function(e){if(e.target===bmOverlay)closeBmOverlay();});
bmForm.addEventListener('submit',function(e){
  e.preventDefault();
  var name=bmName.value.trim(),urlIn=bmUrl.value.trim(),folder=bmFolder.value.trim()||'默认';
  if(!name){bmWrapName.classList.add('err');setTimeout(function(){bmWrapName.classList.remove('err');},700);bmName.focus();return;}
  if(!urlIn){bmWrapUrl.classList.add('err');setTimeout(function(){bmWrapUrl.classList.remove('err');},700);bmUrl.focus();return;}
  var url=urlIn;
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  if(bmEditId){
    for(var i=0;i<bookmarks.length;i++){
      if(bookmarks[i].id===bmEditId){bookmarks[i].name=name;bookmarks[i].url=url;bookmarks[i].folder=folder;break;}
    }
  }else{
    bookmarks.push({id:uid(),name:name,url:url,folder:folder});
  }
  saveBookmarks();renderBookmarks();
  closeBmOverlay();
});
function removeBookmark(id){
  var i=-1;
  for(var k=0;k<bookmarks.length;k++){if(bookmarks[k].id===id){i=k;break;}}
  if(i<0)return;
  var item=bookmarks[i];
  bookmarks.splice(i,1);saveBookmarks();renderBookmarks();
  showToast('已删除书签「'+item.name+'」',function(){
    bookmarks.splice(Math.min(i,bookmarks.length),0,item);
    saveBookmarks();renderBookmarks();
  });
}

/* ================= 账号管理（登录后可用） ================= */
var accounts=[],acctEditId=null,acctDlgMode='create';
function fmtLock(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return m>0?(m+' 分 '+(s>0?s+' 秒':'')):(s+' 秒');
}
function pwCheck(p){
  var kinds=0;
  if(/[a-z]/.test(p))kinds++;
  if(/[A-Z]/.test(p))kinds++;
  if(/[0-9]/.test(p))kinds++;
  if(/[^a-zA-Z0-9]/.test(p))kinds++;
  return {kinds:kinds,lenOk:p.length>=8,ok:p.length>=8&&kinds>=3};
}
function updatePwMeter(){
  var p=aPass.value,ck=pwCheck(p);
  pwMeter.querySelectorAll('span').forEach(function(sp){
    var k=sp.dataset.k,on=false;
    if(k==='lower')on=/[a-z]/.test(p);
    else if(k==='upper')on=/[A-Z]/.test(p);
    else if(k==='digit')on=/[0-9]/.test(p);
    else if(k==='special')on=/[^a-zA-Z0-9]/.test(p);
    else if(k==='len')on=ck.lenOk;
    sp.classList.toggle('on',on);
  });
  pwMeter.classList.toggle('fail',p.length>0&&!ck.lenOk);
}
aPass.addEventListener('input',updatePwMeter);
function loadAccounts(){
  api('admin.php').then(function(d){
    if(d&&d.ok){accounts=d.accounts||[];window.__selfUser=d.self||window.__selfUser;renderAccounts();}
  }).catch(function(){});
}
function renderAccounts(){
  acctCount.textContent=accounts.length;
  var html='';
  accounts.forEach(function(a){
    var self=a.username===window.__selfUser;
    var isAdmin=(a.role||'user')==='admin';
    var roleBadge=isAdmin?'<span class="acct-role">管理员</span>':'<span class="acct-role user">用户</span>';
    var lockTxt=a.locked?('锁定 · 剩 '+fmtLock(a.locked_seconds)):'正常';
    var statusCls=a.locked?'locked':'ok';
    var sub='失败 '+(a.failed_count||0)+'/5 · 创建于 '+String(a.created_at||'').slice(0,10);
    html+='<div class="acct-item" data-id="'+a.id+'" data-user="'+esc(a.username)+'">'
      +'<span class="acct-ava">'+esc(String(a.username).charAt(0).toUpperCase())+'</span>'
      +'<span class="acct-meta"><span class="acct-name">'+esc(a.username)+roleBadge+(self?'<span class="acct-self">当前登录</span>':'')+'</span>'
      +'<span class="acct-sub">'+sub+'</span></span>'
      +'<span class="acct-status '+statusCls+'">'+lockTxt+'</span>'
      +'<span class="acct-acts">'
      +(a.locked?'<button type="button" class="bk-act" data-act="unlock" data-id="'+a.id+'">解锁</button>':'')
      +'<button type="button" class="bk-act" data-act="pass" data-id="'+a.id+'" data-user="'+esc(a.username)+'">改密</button>'
      +(self?'':'<button type="button" class="bk-act" data-act="del" data-id="'+a.id+'" data-user="'+esc(a.username)+'">删除</button>')
      +'</span></div>';
  });
  acctList.innerHTML=html||'<p class="bk-empty">没有账号数据</p>';
}
function openAcct(){acctPanel.classList.add('open');loadAccounts();}
function closeAcct(){acctPanel.classList.remove('open');}
function closeAcctOverlay(){acctOverlay.hidden=true;acctEditId=null;acctErr.textContent='';aPass.value='';aPass2.value='';aUser.value='';}
acctBtn.addEventListener('click',function(){
  if(acctPanel.classList.contains('open'))closeAcct();else openAcct();
});
acctCloseEl.addEventListener('click',closeAcct);
acctAddBtn.addEventListener('click',function(){
  acctDlgMode='create';acctEditId=null;
  acctDlgTitle.textContent='添加账号';
  aWrapUser.style.display='';
  aWrapRole.style.display='';
  aRole.value='user';
  acctErr.textContent='';aUser.value='';aPass.value='';aPass2.value='';
  updatePwMeter();
  acctOverlay.hidden=false;setTimeout(function(){aUser.focus();},30);
});
$('acctCancel').addEventListener('click',closeAcctOverlay);
acctOverlay.addEventListener('click',function(e){if(e.target===acctOverlay)closeAcctOverlay();});
acctForm.addEventListener('submit',function(e){
  e.preventDefault();
  var p=aPass.value,p2=aPass2.value;
  if(p!==p2){acctErr.textContent='两次输入的密码不一致';aWrapPass2.classList.add('err');setTimeout(function(){aWrapPass2.classList.remove('err');},700);return;}
  var ck=pwCheck(p);
  if(!ck.ok){acctErr.textContent='密码不满足复杂度要求：至少 8 位，且包含大写字母、小写字母、数字、特殊字符中至少 3 类';aWrapPass.classList.add('err');setTimeout(function(){aWrapPass.classList.remove('err');},700);return;}
  if(acctDlgMode==='create'){
    var u=aUser.value.trim();
    if(!/^[A-Za-z0-9_-]{3,30}$/.test(u)){acctErr.textContent='用户名须为 3~30 位字母/数字/_/-';aWrapUser.classList.add('err');setTimeout(function(){aWrapUser.classList.remove('err');},700);return;}
    api('admin.php',{method:'POST',body:{action:'create',username:u,pass:p,role:aRole.value}}).then(function(d){
      if(d&&d.ok){closeAcctOverlay();loadAccounts();showToast('账号「'+u+'」已创建（'+(aRole.value==='admin'?'管理员':'普通用户')+'）');}
      else{acctErr.textContent=(d&&d.msg)||'创建失败';}
    }).catch(function(){acctErr.textContent='网络异常，请重试';});
  }else{
    api('admin.php',{method:'POST',body:{action:'change_pass',id:acctEditId,pass:p}}).then(function(d){
      if(d&&d.ok){closeAcctOverlay();loadAccounts();showToast('密码已修改（失败计数已重置）');}
      else{acctErr.textContent=(d&&d.msg)||'修改失败';}
    }).catch(function(){acctErr.textContent='网络异常，请重试';});
  }
});
acctList.addEventListener('click',function(e){
  var btn=e.target.closest('.bk-act');
  if(!btn)return;
  var id=btn.dataset.id,user=btn.dataset.user,act=btn.dataset.act;
  if(act==='unlock'){
    api('admin.php',{method:'POST',body:{action:'unlock',id:id}}).then(function(d){
      if(d&&d.ok){loadAccounts();showToast('账号「'+user+'」已解锁');}
    }).catch(function(){});
  }else if(act==='pass'){
    acctDlgMode='pass';acctEditId=id;
    acctDlgTitle.textContent='修改密码 · '+user;
    aWrapUser.style.display='none';
    aWrapRole.style.display='none';
    acctErr.textContent='';aPass.value='';aPass2.value='';
    updatePwMeter();
    acctOverlay.hidden=false;setTimeout(function(){aPass.focus();},30);
  }else if(act==='del'){
    if(confirm('删除账号「'+user+'」？\n删除后该账号将无法登录。')){
      api('admin.php',{method:'POST',body:{action:'delete',id:id}}).then(function(d){
        if(d&&d.ok){loadAccounts();showToast('账号「'+user+'」已删除');}
        else{showToast((d&&d.msg)||'删除失败');}
      }).catch(function(){});
    }
  }
});

/* ================= 键盘 ================= */
function isTyping(t){
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
}
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!isTyping(e.target)){e.preventDefault();input.focus();}
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus();}
  if(e.key==='Escape'){
    if(!loginOverlay.hidden){closeLogin();}
    else if(!overlay.hidden){closeDialog();}
    else if(!acctOverlay.hidden){closeAcctOverlay();}
    else if(acctPanel.classList.contains('open')){closeAcct();}
    else if(!bmOverlay.hidden){closeBmOverlay();}
    else if(bmPanel.classList.contains('open')){closeBm();}
    else if(notePanel.classList.contains('open')){closeNote();}
    else if(document.activeElement===input){input.value='';input.blur();}
  }
});

/* ================= 星尘背景 ================= */
var cv=$('stars'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DPR=Math.min(window.devicePixelRatio||1,2);
var stars=[],W=0,H=0,mx=0,my=0;
function seed(){
  var n=Math.max(60,Math.min(170,Math.round(W*H/9000)));
  stars=[];
  for(var i=0;i<n;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,z:.25+Math.random()*.75,r:.4+Math.random()*1.3,tw:Math.random()*Math.PI*2});
  }
}
function sizeCanvas(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  seed();
}
function paint(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#C9D8F2';
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.tw+=.02;s.x-=s.z*.05;
    if(s.x<-3){s.x=W+3;s.y=Math.random()*H;}
    ctx.globalAlpha=(.18+.5*Math.abs(Math.sin(s.tw)))*s.z;
    ctx.beginPath();
    ctx.arc(s.x+mx*14*s.z,s.y+my*10*s.z,s.r,0,6.2832);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function loop(){paint();requestAnimationFrame(loop);}
sizeCanvas();
window.addEventListener('resize',sizeCanvas);
window.addEventListener('mousemove',function(e){mx=e.clientX/W-.5;my=e.clientY/H-.5;},{passive:true});
if(REDUCED){paint();}else{loop();}

/* ================= 启动 ================= */
/* loadLinks：唯一驱动器——服务端按会话返回对应页面（访客/管理员→原始首页；普通用户→个人页）
   并携带登录角色，据此驱动整套角色门禁 UI */
function loadLinks(){
  api('links.php').then(function(d){
    if(d&&d.ok){
      links=Array.isArray(d.links)?d.links:[];
    if(d.role){logged=true;window.__selfUser=d.user;window.__role=d.role;}
    else{logged=false;window.__selfUser=null;window.__role=null;}
    applyAuth();
    pageChip.textContent=(d.page==='personal')?'我的导航页':'原始首页';
    render();
    if(logged)loadNote();
  }
  }).catch(function(){});
}
logged=false;
applyAuth();
renderChips();
render();
loadLinks();
})();
